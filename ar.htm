<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Solar System Relative Scale Comparison</title>
    
    <!-- Three.js (Core 3D Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- AR.js (Marker Tracking extending Three.js) -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/three.js/build/ar.js"></script>

    <style>
        /* Modern, clean UI styling */
        :root {
            --primary-bg: #f8fafc;
            --panel-bg: #ffffff;
            --text-main: #1e293b;
            --accent-color: #3b82f6;
            --border-color: #cbd5e1;
            --space-bg: #0f172a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        /* Prevent scrolling in AR mode */
        body.ar-active {
            overflow: hidden;
            background-color: transparent;
        }

        /* Fixed Top Navigation / Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 15px 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
        }

        .header-subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 4px;
        }

        /* Prominent Mode Toggle Button */
        #mode-toggle {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: transform 0.2s, background-color 0.2s;
        }

        #mode-toggle:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }

        /* --- Mode A: Non-AR Container --- */
        #non-ar-mode {
            padding-top: 100px; /* Space for fixed header */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            padding-bottom: 40px;
        }

        .split-screen-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 30px;
            padding: 0 20px;
            margin-top: 20px;
        }

        .viewer-panel {
            flex: 1;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        select {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 1.1rem;
            font-weight: 600;
            background-color: #f8fafc;
            color: var(--text-main);
            cursor: pointer;
            width: 60%;
            outline: none;
        }

        select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .metric-badge {
            background: #e2e8f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #475569;
        }

        /* The 3D Canvas Area */
        .canvas-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--space-bg);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            cursor: grab;
            touch-action: none; /* Prevents scrolling on mobile while dragging */
        }

        .canvas-container:active {
            cursor: grabbing;
        }

        .zoom-container {
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-sizing: border-box;
        }
        
        .zoom-label {
            font-weight: 600;
            color: var(--text-main);
        }
        
        #zoom-slider {
            flex: 1;
            cursor: pointer;
        }

        .info-overlay {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            padding: 12px;
            border-radius: 8px;
            color: white;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .info-overlay h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
        }

        .info-overlay p {
            margin: 0;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* --- Mode B: AR Container --- */
        #ar-mode {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Instruction overlay for AR mode */
        #ar-instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            font-weight: 500;
            z-index: 1001;
            backdrop-filter: blur(4px);
            text-align: center;
            pointer-events: none; /* Let clicks pass through to video */
        }

        /* AR.js video scaling fix */
        video {
            object-fit: cover;
        }

        @media (max-width: 800px) {
            .split-screen-container {
                flex-direction: column;
            }
            header {
                flex-direction: column;
                padding: 15px;
                text-align: center;
                gap: 15px;
            }
            #non-ar-mode {
                padding-top: 140px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Solar System Scale</h1>
            <div class="header-subtitle">True Relative Size Comparison</div>
        </div>
        <button id="mode-toggle">Enter AR Mode</button>
    </header>

    <!-- Mode A: Non-AR View -->
    <div id="non-ar-mode">
        <div class="zoom-container">
            <span class="zoom-label">Magnify:</span>
            <input type="range" id="zoom-slider" min="0.1" max="5" step="0.05" value="1">
        </div>
        <div class="split-screen-container">
            <!-- Left Viewer -->
            <div class="viewer-panel">
                <div class="control-row">
                    <select id="select-left"></select>
                    <div class="metric-badge" id="metric-left">Loading...</div>
                </div>
                <div class="canvas-container" id="canvas-container-left">
                    <div class="info-overlay">
                        <h3 id="name-left">Planet</h3>
                        <p id="desc-left">Radius: -</p>
                    </div>
                </div>
            </div>

            <!-- Right Viewer -->
            <div class="viewer-panel">
                <div class="control-row">
                    <select id="select-right"></select>
                    <div class="metric-badge" id="metric-right">Loading...</div>
                </div>
                <div class="canvas-container" id="canvas-container-right">
                    <div class="info-overlay">
                        <h3 id="name-right">Planet</h3>
                        <p id="desc-right">Radius: -</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Mode B: AR View -->
    <div id="ar-mode">
        <div id="ar-instructions">
            Point camera at Barcode Markers (0-7) to see planets. Bring two together to compare!
        </div>
        <!-- AR.js elements will be injected here via scripts -->
    </div>

    <script>
        // --- Core Planetary Data (True Relative Radii based on Earth = 1) ---
        // Earth radius ~ 6,371 km
        const planetData = [
            { id: 0, name: "Mercury", radius: 0.383, texUrl: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/mercurymap.jpg", hasRing: false },
            { id: 1, name: "Venus", radius: 0.950, texUrl: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/venusmap.jpg", hasRing: false },
            { id: 2, name: "Earth", radius: 1.000, texUrl: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/earthmap1k.jpg", hasRing: false },
            { id: 3, name: "Mars", radius: 0.532, texUrl: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/marsmap1k.jpg", hasRing: false },
            { id: 4, name: "Jupiter", radius: 10.97, texUrl: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/jupitermap.jpg", hasRing: false },
            { id: 5, name: "Saturn", radius: 9.14, texUrl: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/saturnmap.jpg", hasRing: true, ringType: 'saturn' },
            { id: 6, name: "Uranus", radius: 3.98, texUrl: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/uranusmap.jpg", hasRing: true, ringType: 'uranus' },
            { id: 7, name: "Neptune", radius: 3.86, texUrl: "https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/neptunemap.jpg", hasRing: false }
        ];

        // Global Texture Loader (Cross-Origin enabled)
        const textureLoader = new THREE.TextureLoader();
        textureLoader.crossOrigin = "anonymous";
        
        // Cache textures so we don't reload them multiple times
        const textureCache = {};
        planetData.forEach(p => {
            textureCache[p.name] = textureLoader.load(p.texUrl);
        });

        // --- Shared Function: Create Planet Mesh ---
        // Generates the 3D object based on data, used by both AR and Non-AR engines
        function createPlanetGroup(data, scaleMultiplier = 1) {
            const group = new THREE.Group();
            
            // Base Sphere
            const geometry = new THREE.SphereGeometry(data.radius * scaleMultiplier, 64, 64);
            const material = new THREE.MeshPhongMaterial({
                map: textureCache[data.name],
                shininess: 10
            });
            const sphere = new THREE.Mesh(geometry, material);
            group.add(sphere);

            // Ring Generation
            if (data.hasRing) {
                if (data.ringType === 'saturn') {
                    // Stylized procedural flat 3D ring geometry aligned with its equator
                    const ringGeo = new THREE.RingGeometry(data.radius * scaleMultiplier * 1.3, data.radius * scaleMultiplier * 2.3, 64);
                    const ringMat = new THREE.MeshPhongMaterial({
                        color: 0xc2a67e, // Saturn ring dusty color
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.85
                    });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    // Align ring with equator (lay flat) and apply a slight tilt so it's visible to camera
                    ring.rotation.x = Math.PI / 2;
                    group.add(ring);
                } else if (data.ringType === 'uranus') {
                    // Subtle ring system
                    const ringGeo = new THREE.RingGeometry(data.radius * scaleMultiplier * 1.5, data.radius * scaleMultiplier * 1.6, 64);
                    const ringMat = new THREE.MeshPhongMaterial({
                        color: 0x99badd, // Faint ice blue
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.4
                    });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    // Uranus has an extreme tilt, representing it here
                    ring.rotation.x = Math.PI / 2;
                    ring.rotation.y = Math.PI / 4; 
                    group.add(ring);
                }
            }
            
            // To ensure they look good statically, rotate them to show a good face
            sphere.rotation.y = Math.PI / -2; 

            return group;
        }

        // --- Mode A: Non-AR Engine Setup ---
        
        class PlanetViewer {
            constructor(containerId, dataPrefix) {
                this.container = document.getElementById(containerId);
                this.dataPrefix = dataPrefix; // 'left' or 'right'
                this.currentMesh = null;
                this.currentZoom = 1;

                // Scene setup
                this.scene = new THREE.Scene();
                
                // Lighting: Uniform global light source
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                this.scene.add(ambientLight);
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(5, 5, 5);
                this.scene.add(directionalLight);

                // Camera setup
                const width = this.container.clientWidth;
                const height = this.container.clientHeight;
                this.camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                
                // CRITICAL SCALING CONSTRAINT: 
                // Fix camera distance far enough so Jupiter (radius ~11, diameter 22) fits.
                // At Z=35 and FOV=45, the frustum height at origin is ~29 units.
                this.camera.position.z = 35; 

                // Renderer setup
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.container.appendChild(this.renderer.domElement);

                // Handle resize
                window.addEventListener('resize', () => this.onWindowResize());
                
                // Initialize drag-to-rotate interaction
                this.initInteraction();
            }

            initInteraction() {
                let isDragging = false;
                let previousMousePosition = { x: 0, y: 0 };

                const down = (e) => {
                    isDragging = true;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    previousMousePosition = { x: clientX, y: clientY };
                };

                const move = (e) => {
                    if (!isDragging || !this.currentMesh) return;
                    
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    
                    const deltaMove = {
                        x: clientX - previousMousePosition.x,
                        y: clientY - previousMousePosition.y
                    };

                    // Apply rotation directly to the mesh group
                    this.currentMesh.rotation.y += deltaMove.x * 0.008;
                    this.currentMesh.rotation.x += deltaMove.y * 0.008;

                    previousMousePosition = { x: clientX, y: clientY };
                };

                const up = () => {
                    isDragging = false;
                };

                this.container.addEventListener('mousedown', down);
                this.container.addEventListener('mousemove', move);
                window.addEventListener('mouseup', up); // Catch releases outside the box
                
                this.container.addEventListener('touchstart', down);
                this.container.addEventListener('touchmove', move);
                window.addEventListener('touchend', up);
            }

            setZoom(scale) {
                this.currentZoom = scale;
                if (this.currentMesh) {
                    this.currentMesh.scale.set(scale, scale, scale);
                }
            }

            onWindowResize() {
                if(this.container.clientWidth === 0) return; // Hidden
                const width = this.container.clientWidth;
                const height = this.container.clientHeight;
                this.camera.aspect = width / height;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(width, height);
            }

            renderPlanet(planetIndex) {
                const data = planetData[planetIndex];
                
                // Remove old mesh
                if (this.currentMesh) {
                    this.scene.remove(this.currentMesh);
                    // Dispose geometries/materials to prevent memory leaks
                    this.currentMesh.traverse(child => {
                        if (child.isMesh) {
                            child.geometry.dispose();
                            child.material.dispose();
                        }
                    });
                }

                // Create and add new mesh (Scale 1:1 with relative radius data)
                this.currentMesh = createPlanetGroup(data, 1);
                
                // Apply current magnification state
                this.currentMesh.scale.set(this.currentZoom, this.currentZoom, this.currentZoom);
                
                // Add slight tilt to the group for better static viewing angle
                this.currentMesh.rotation.x = 0.2; 
                this.scene.add(this.currentMesh);

                // Update UI Labels
                document.getElementById(`name-${this.dataPrefix}`).innerText = data.name;
                
                const realRadiusKm = Math.round(data.radius * 6371).toLocaleString();
                document.getElementById(`desc-${this.dataPrefix}`).innerText = `Est. Radius: ${realRadiusKm} km`;
                
                const relativeStr = data.radius === 1 ? "1.00x Earth" : `${data.radius.toFixed(2)}x Earth`;
                document.getElementById(`metric-${this.dataPrefix}`).innerText = relativeStr;

                // Force render
                this.renderer.render(this.scene, this.camera);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                // NO AUTO-ROTATION per constraints. Only render.
                this.renderer.render(this.scene, this.camera);
            }
        }

        // Initialize Non-AR Viewers
        const viewerLeft = new PlanetViewer('canvas-container-left', 'left');
        const viewerRight = new PlanetViewer('canvas-container-right', 'right');

        // Populate Dropdowns and setup event listeners
        const selectLeft = document.getElementById('select-left');
        const selectRight = document.getElementById('select-right');

        planetData.forEach((p, index) => {
            const optLeft = document.createElement('option');
            optLeft.value = index;
            optLeft.text = p.name;
            selectLeft.appendChild(optLeft);

            const optRight = document.createElement('option');
            optRight.value = index;
            optRight.text = p.name;
            selectRight.appendChild(optRight);
        });

        // Default selections (Earth and Jupiter for dramatic contrast)
        selectLeft.value = 2; // Earth
        selectRight.value = 4; // Jupiter

        selectLeft.addEventListener('change', (e) => viewerLeft.renderPlanet(e.target.value));
        selectRight.addEventListener('change', (e) => viewerRight.renderPlanet(e.target.value));

        // Setup Zoom Slider logic
        const zoomSlider = document.getElementById('zoom-slider');
        if (zoomSlider) {
            zoomSlider.addEventListener('input', (e) => {
                const zoomVal = parseFloat(e.target.value);
                viewerLeft.setZoom(zoomVal);
                viewerRight.setZoom(zoomVal);
            });
        }

        // Initial Render
        viewerLeft.renderPlanet(2);
        viewerRight.renderPlanet(4);

        // Start animation loops
        viewerLeft.animate();
        viewerRight.animate();

        // --- Mode B: AR Engine Setup ---
        
        let arScene, arCamera, arRenderer, arToolkitSource, arToolkitContext;
        let arActive = false;
        let arAnimationId;

        function initializeAR() {
            if (arActive) return;

            // Ensure THREEx loaded correctly before initializing
            if (typeof THREEx === 'undefined') {
                const instructions = document.getElementById('ar-instructions');
                if (instructions) {
                    instructions.innerText = "Error: AR.js library failed to load. Please check your network connection or disable script blockers.";
                    instructions.style.backgroundColor = "rgba(220, 38, 38, 0.9)";
                }
                console.error("THREEx is not defined. The AR.js script failed to load.");
                return;
            }

            // --- BUG FIX: AR.js + Three.js r128+ EventDispatcher Polyfill ---
            // Three.js r128+ converted EventDispatcher to an ES6 class. Class methods are non-enumerable, 
            // causing AR.js's Object.assign() to fail at copying them. We manually map them here.
            const dispatcherMethods = ['addEventListener', 'hasEventListener', 'removeEventListener', 'dispatchEvent'];
            dispatcherMethods.forEach(method => {
                THREEx.ArToolkitContext.prototype[method] = THREE.EventDispatcher.prototype[method];
                THREEx.ArToolkitSource.prototype[method] = THREE.EventDispatcher.prototype[method];
                THREEx.ArMarkerControls.prototype[method] = THREE.EventDispatcher.prototype[method];
            });
            // ----------------------------------------------------------------

            // 1. Setup basic Three.js scene
            arScene = new THREE.Scene();
            
            // Uniform lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            arScene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            arScene.add(directionalLight);

            arCamera = new THREE.Camera();
            arScene.add(arCamera);

            arRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            arRenderer.setSize(window.innerWidth, window.innerHeight);
            arRenderer.domElement.style.position = 'absolute';
            arRenderer.domElement.style.top = '0px';
            arRenderer.domElement.style.left = '0px';
            document.getElementById('ar-mode').appendChild(arRenderer.domElement);

            // 2. Setup ARToolkit Source (Webcam)
            arToolkitSource = new THREEx.ArToolkitSource({ sourceType: 'webcam' });

            arToolkitSource.init(function onReady() {
                onResizeAR();
            });

            // Handle window resize for AR camera stream
            window.addEventListener('resize', onResizeAR);
            function onResizeAR() {
                if(arActive) {
                    arToolkitSource.onResizeElement();
                    arToolkitSource.copyElementSizeTo(arRenderer.domElement);
                    if(arToolkitContext && arToolkitContext.arController !== null) {
                        arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
                    }
                }
            }

            // 3. Setup ARToolkit Context (Tracking Engine)
            // Configured for matrix/barcode tracking as requested
            arToolkitContext = new THREEx.ArToolkitContext({
                cameraParametersUrl: 'https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.3.2/data/data/camera_para.dat',
                detectionMode: 'mono_and_matrix',
                matrixCodeType: '3x3'
            });

            arToolkitContext.init(function onCompleted() {
                arCamera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix());
            });

            // 4. Setup Markers and Planet Meshes
            planetData.forEach(data => {
                const markerRoot = new THREE.Group();
                arScene.add(markerRoot);

                // Map the 8 planets to barcode markers 0 through 7
                new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
                    type: 'barcode',
                    barcodeValue: data.id
                });

                // Calculate scale. 
                // A standard marker is 1 unit in AR space.
                // If Earth (radius 1) uses multiplier 0.5, its diameter is 1 unit (fits perfectly over marker).
                // Jupiter (radius 10.97) will have diameter ~11 units in AR space.
                const arScaleMultiplier = 0.5;
                const meshGroup = createPlanetGroup(data, arScaleMultiplier);
                
                // Lift mesh slightly so it sits "on" the marker rather than intersecting it
                meshGroup.position.y = data.radius * arScaleMultiplier;
                
                markerRoot.add(meshGroup);
            });

            // 5. AR Animation Loop
            arActive = true;
            
            function animateAR() {
                if (!arActive) return;
                arAnimationId = requestAnimationFrame(animateAR);

                if (arToolkitSource.ready !== false) {
                    arToolkitContext.update(arToolkitSource.domElement);
                }
                
                // NO AUTO-ROTATION per constraints
                arRenderer.render(arScene, arCamera);
            }
            animateAR();
        }

        // Cleanly mounts and unmounts components based on selected mode
        function destroyAR() {
            if (!arActive) return;
            arActive = false;
            cancelAnimationFrame(arAnimationId);

            // 1. Stop video stream to turn off webcam light
            if (arToolkitSource && arToolkitSource.domElement) {
                const stream = arToolkitSource.domElement.srcObject;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            }

            // 2. Remove video elements injected by AR.js into the body
            const videos = document.querySelectorAll('video');
            videos.forEach(v => v.remove());

            // 3. Clear AR canvas
            const arContainer = document.getElementById('ar-mode');
            const arInstructions = document.getElementById('ar-instructions');
            arContainer.innerHTML = ''; 
            arContainer.appendChild(arInstructions); // Keep instructions for next time

            // 4. Reset references to allow clean garbage collection
            arScene = null;
            arCamera = null;
            arRenderer = null;
            arToolkitSource = null;
            arToolkitContext = null;
        }

        // --- UI/UX Toggle Controls ---
        const btnToggle = document.getElementById('mode-toggle');
        const viewNonAr = document.getElementById('non-ar-mode');
        const viewAr = document.getElementById('ar-mode');

        btnToggle.addEventListener('click', () => {
            if (viewAr.style.display === 'block') {
                // Switching to Non-AR Mode
                destroyAR();
                viewAr.style.display = 'none';
                viewNonAr.style.display = 'flex';
                document.body.classList.remove('ar-active');
                btnToggle.innerText = 'Enter AR Mode';
                
                // Trigger resize to fix any layout issues after returning from fixed AR view
                window.dispatchEvent(new Event('resize'));
            } else {
                // Switching to AR Mode
                viewNonAr.style.display = 'none';
                viewAr.style.display = 'block';
                document.body.classList.add('ar-active');
                btnToggle.innerText = 'Exit AR Mode';
                initializeAR();
            }
        });

    </script>
</body>
</html>
