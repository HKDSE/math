<head>
</head>
<body>
    <p id="clickable" class="clickable-text">Click this text!</p>

    <script>
        const clickableText = document.getElementById('clickable');
        clickableText.addEventListener('click', handleClick);

        function handleClick() {
            console.log('Text was clicked!'); // Debug log to confirm click
            alert('You clicked the text!');
        }
    </script>
</body>
</html>
