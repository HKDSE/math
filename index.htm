<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extract GeoGebra data-param-id</title>
</head>
<body>
    <h1>GeoGebra data-param-id Extractor</h1>
    <p>URL: <span id="url">https://www.geogebra.org/m/zxdavtjx</span></p>
    <p>Extracted data-param-id: <span id="dataParamId">Click the button to extract</span></p>
    <button onclick="extractDataParamId()">Extract data-param-id</button>

    <script>
        // Simulated HTML content from the GeoGebra page (replace with actual fetched content)
        const pageContent = `
            <html>
            <body>
                <div class="applet_container" data-param-id="ggbApplet53580537" ...>
                    <!-- Rest of the page content -->
                </div>
            </body>
            </html>
        `;

        function extractDataParamId() {
alert("");
            const url = document.getElementById('url').textContent;
            const idElement = document.getElementById('dataParamId');

            // Create a temporary DOM element to parse the HTML content
            const parser = new DOMParser();
            const doc = parser.parseFromString(pageContent, 'text/html');

            // Find the element with data-param-id attribute
            const elementWithDataParamId = doc.querySelector('[data-param-id]');
            const dataParamId = elementWithDataParamId ? elementWithDataParamId.getAttribute('data-param-id') : null;

            if (dataParamId) {
                idElement.textContent = dataParamId;
            } else {
                idElement.textContent = 'data-param-id not found';
            }
        }
    </script>
</body>
</html>
